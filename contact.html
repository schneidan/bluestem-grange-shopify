<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Bluestem Grange</title>
    <base href="/bluestem-grange/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Josefin+Sans:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/base.css">
    <link rel="icon" href="assets/bluestem-grange-logo-BG.png" type="image/png">
  </head>
  <body>
    <a class="skip-link" href="#MainContent">Skip to content</a>
    <header class="site-header site-header--page is-visible" data-compact-header>
      <a class="site-header__mark" href="index.html">
        <img src="assets/bluestem-grange-logo-full-horz.png" alt="Bluestem Grange" width="1562" height="300">
      </a>
      <nav class="site-nav" aria-label="Primary">
          <a href="index.html">Shop</a>
          <a href="about.html">About</a>
          <a href="shipping.html">Shipping</a>
          <a href="contact.html" aria-current="page">Contact</a>
          <a href="cart.html">Cart</a>
      </nav>
    </header>
    <main id="MainContent" class="page-main">
      <div class="page-width">
        <article class="prose">
          <h1>Contact</h1>
          <p>Questions about an order or a custom batch? Write us at <a href="mailto:hello@bluestemgrange.com">hello@bluestemgrange.com</a> or use the form.</p>
          <form class="contact-form" action="#" method="post">
            <div class="field">
              <label for="ContactName">Name</label>
              <input type="text" id="ContactName" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="ContactEmail">Email</label>
              <input type="email" id="ContactEmail" name="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="ContactBody">Message</label>
              <textarea id="ContactBody" name="body" required></textarea>
            </div>
            <button type="submit">Send</button>
          </form>
        </article>
      </div>
    </main>
    <footer class="site-footer">
      <a class="site-footer__wordmark" href="index.html">
        <img src="assets/bluestem-grange-logo-horz-name-only.png" alt="Bluestem Grange" width="800" height="160">
      </a>
      <p class="site-footer__note">Handmade bar soap · Franktown, Colorado · Est. 2020</p>
    </footer>
    <script src="assets/theme.js" defer></script>
  </body>
</html>
